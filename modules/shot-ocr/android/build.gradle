plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.shotocr'
version = '1.0.0'

android {
  namespace "expo.modules.shotocr"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
